name: RCCAD Desktop - Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['rccad-desktop-v*']
    paths:
      - 'Claude-RCCAD-main/native/**'
      - '.github/workflows/native-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: Claude-RCCAD-main/native
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: 'Claude-RCCAD-main/native/requirements*.txt'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test native geometry and interface
        env:
          DIAG_FILE: ${{ runner.temp }}/rccad-test-diag.log
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows executable
        run: |
          python stamp_build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm RCCAD.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test packaged executable
        run: |
          $exe = Join-Path $PWD 'dist/RCCAD Desktop/RCCAD Desktop.exe'
          $report = Join-Path $PWD 'dist/RCCAD Desktop/selftest_windows.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--report', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(180000)) {
            $process.Kill()
            throw 'Packaged executable self-test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Self-test exited with $($process.ExitCode)" }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.passed -ne $true -or $result.platform -notlike 'Windows*' -or $result.checks.Count -lt 13) {
            throw 'Self-test report did not confirm Windows readiness'
          }
      - name: Package portable application
        run: |
          Compress-Archive -Path 'dist/RCCAD Desktop' -DestinationPath 'dist/RCCAD-Desktop-Windows-x64.zip'
          Get-FileHash 'dist/RCCAD-Desktop-Windows-x64.zip' -Algorithm SHA256 | Format-List | Out-File 'dist/SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: RCCAD-Desktop-Windows-x64
          path: |
            Claude-RCCAD-main/native/dist/RCCAD-Desktop-Windows-x64.zip
            Claude-RCCAD-main/native/dist/SHA256.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/rccad-desktop-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RCCAD-Desktop-Windows-x64
          path: release-assets
      - name: Publish tested Windows package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --title "RCCAD Desktop ${GITHUB_REF_NAME#rccad-desktop-v} — blachy" \
            --notes-file Claude-RCCAD-main/native/SHEETMETAL_RELEASE.md
